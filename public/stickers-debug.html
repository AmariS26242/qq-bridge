<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表情检索 · 为什么选中这张</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8b93a7; --accent:#5aa9ff; --good:#3ecf8e; --warn:#f5a524; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 12px 0 0; font-weight:600; }
  input[type=text] { flex:1; min-width:260px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:#11141b; color:var(--fg); font-size:14px; }
  input[type=number] { width:70px; padding:9px; border-radius:8px; border:1px solid var(--line); background:#11141b; color:var(--fg); }
  button { padding:9px 16px; border-radius:8px; border:0; background:var(--accent); color:#06101d; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  main { padding:20px; max-width:1100px; margin:0 auto; display:grid; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .meta { color:var(--dim); font-size:12.5px; }
  .hit { display:grid; grid-template-columns:64px 1fr; gap:14px; }
  .thumb { width:64px; height:64px; border-radius:10px; object-fit:cover; background:#0b0d12; border:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .score { font-variant-numeric:tabular-nums; font-weight:700; color:var(--good); }
  .bar { height:6px; border-radius:4px; background:#0b0d12; overflow:hidden; flex:1; min-width:80px; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#3ecf8e,#5aa9ff); }
  .tag { font-size:12px; padding:2px 8px; border-radius:999px; background:#1d2430; color:#a9b6cc; }
  .tag.syn { border:1px dashed #354058; color:#7f8ba3; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .breakdown { margin-top:8px; overflow-x:auto; }
  .bonus { color:var(--warn); font-size:12.5px; }
  .empty { color:var(--dim); padding:28px 0; text-align:center; }
  code { background:#0b0d12; padding:1px 5px; border-radius:5px; font-size:12.5px; }
</style>
</head>
<body>
<header>
  <h1>表情检索 · 为什么选中这张</h1>
  <input id="q" type="text" placeholder="输入一句口语，比如「被老板催着干活」" autofocus>
  <input id="n" type="number" value="5" min="1" max="20" title="返回条数">
  <button id="go">分析</button>
  <span class="meta" id="status"></span>
</header>
<main>
  <section class="card" id="termsCard" hidden>
    <div class="meta" id="termsMeta"></div>
    <div class="row" id="terms" style="margin-top:8px"></div>
  </section>
  <section id="hits"></section>
  <div class="empty" id="empty">输入一句话，看分词、同义扩展、每个词的字段权重与加分项。</div>
</main>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get('token');
  if (token) { localStorage.setItem('consoleToken', token); history.replaceState({}, '', location.pathname); }
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path) {
  const headers = {};
  const token = localStorage.getItem('consoleToken');
  if (token) headers['x-console-token'] = token;
  const res = await fetch(path, { headers });
  if (res.status === 401) throw new Error('需要令牌：请从控制台地址带 ?token=… 打开本页');
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) throw new Error(body.error || ('HTTP ' + res.status));
  return body;
}

function renderTerms(report) {
  if (!report.terms.length) { $('termsCard').hidden = true; return; }
  $('termsCard').hidden = false;
  const own = report.terms.filter((t) => !t.synonym).length;
  $('termsMeta').textContent = '查询归一化「' + report.normalized + '」 · 原始词 ' + own + ' 个 + 同义扩展 ' + (report.terms.length - own) + ' 个 · 库内 ' + report.total + ' 条';
  $('terms').innerHTML = report.terms.map((t) =>
    '<span class="tag' + (t.synonym ? ' syn' : '') + '" title="q权重 ' + t.queryWeight + ' · df ' + t.df + ' · idf ' + t.idf + '">' +
    esc(t.term) + (t.synonym ? ' ×' + t.queryWeight : '') + '</span>'
  ).join('');
}

function renderHits(report) {
  const hits = report.hits || [];
  $('empty').hidden = hits.length > 0;
  const top = hits[0] ? hits[0].score : 1;
  $('hits').innerHTML = hits.map((hit, i) => {
    const rows = hit.terms.map((t) => {
      const fields = t.fields.length
        ? t.fields.map((f) => f.field + '×' + f.tf).join(' · ')
        : '<span class="meta">—</span>';
      return '<tr><td><code>' + esc(t.term) + '</code></td><td class="num">' + t.queryWeight + '</td><td class="num">' + t.tf +
        '</td><td class="num">' + t.idf + '</td><td class="num">' + t.contribution + '</td><td>' + fields + '</td></tr>';
    }).join('');
    const bonus = hit.bonuses.length
      ? hit.bonuses.map((b) => esc(b.label) + ' +' + b.points).join('；')
      : '无';
    return '<section class="card hit">' +
      (hit.url ? '<img class="thumb" loading="lazy" referrerpolicy="no-referrer" src="' + esc(hit.url) + '" onerror="this.style.visibility=\'hidden\'">' : '<div class="thumb"></div>') +
      '<div>' +
        '<div class="row">' +
          '<span class="meta">#' + (i + 1) + '</span>' +
          '<span class="score">' + hit.score + '</span>' +
          '<div class="bar"><i style="width:' + Math.max(3, Math.round((hit.score / top) * 100)) + '%"></i></div>' +
          (hit.tags || []).map((t) => '<span class="tag">' + esc(t) + '</span>').join('') +
        '</div>' +
        '<div style="margin-top:4px">' + esc(hit.desc || '(无配字)') + '</div>' +
        '<div class="meta">' + esc(hit.localNote || '') + ' · 已用 ' + hit.useCount + ' 次</div>' +
        '<div class="bonus">加分项：' + bonus + '</div>' +
        '<div class="breakdown"><table><thead><tr><th>词条</th><th>q权重</th><th>tf</th><th>idf</th><th>贡献</th><th>命中字段</th></tr></thead><tbody>' +
          rows + '</tbody></table></div>' +
      '</div></section>';
  }).join('');
}

async function run() {
  const q = $('q').value.trim();
  if (!q) return;
  const n = Math.max(1, Math.min(20, Number($('n').value) || 5));
  $('go').disabled = true;
  $('status').textContent = '检索中…';
  try {
    const report = await api('/api/stickers/explain?q=' + encodeURIComponent(q) + '&limit=' + n);
    renderTerms(report);
    renderHits(report);
    $('status').textContent = report.hits.length + ' 条结果';
  } catch (error) {
    $('status').textContent = '';
    $('hits').innerHTML = '';
    $('empty').hidden = false;
    $('empty').textContent = '出错：' + error.message;
  } finally {
    $('go').disabled = false;
  }
}

$('go').addEventListener('click', run);
$('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
const initial = new URLSearchParams(location.search).get('q');
if (initial) { $('q').value = initial; run(); }
</script>
</body>
</html>
