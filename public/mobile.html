<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QQ 后台">
<title>QQ 后台 · 手机版</title>
<link rel="manifest" href="./m/manifest.webmanifest">
<link rel="icon" href="./m/icon-192.png">
<link rel="apple-touch-icon" href="./m/icon-192.png">
<style>
  :root {
    --bg: #0b1013;
    --card: #141c21;
    --card-2: #1a242a;
    --line: #24313a;
    --fg: #e6eef2;
    --dim: #8fa3ae;
    --ok: #35d07f;
    --warn: #e8b84b;
    --bad: #ef5b5b;
    --accent: #22d3c5;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: env(safe-area-inset-top) 12px calc(20px + env(safe-area-inset-bottom));
    max-width: 720px; margin: 0 auto;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    margin: 0 -12px 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: linear-gradient(180deg, #0b1013 70%, rgba(11,16,19,.86));
    backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  header .dot.ok { background: var(--ok); box-shadow: 0 0 10px rgba(53,208,127,.7); }
  header .dot.warn { background: var(--warn); }
  header .dot.bad { background: var(--bad); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .sub { font-size: 11px; color: var(--dim); margin-left: auto; text-align: right; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 14px; margin: 0 0 10px;
  }
  .card h2 { font-size: 13px; margin: 0 0 9px; color: var(--dim); font-weight: 600; letter-spacing: .4px; display: flex; justify-content: space-between; align-items: center; }
  .card h2 .tag { font-size: 11px; color: var(--accent); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px; padding: 4px 9px; border-radius: 999px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--dim);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chip b { color: var(--fg); font-weight: 600; }
  .chip.ok { border-color: rgba(53,208,127,.45); color: #a8e9c6; }
  .chip.warn { border-color: rgba(232,184,75,.45); color: #f0d79a; }
  .chip.bad { border-color: rgba(239,91,91,.45); color: #f4b0b0; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .metric { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; text-align: center; }
  .metric .v { font-size: 19px; font-weight: 650; line-height: 1.2; }
  .metric .k { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed rgba(36,49,58,.7); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--dim); }
  .row .v { text-align: right; word-break: break-all; }
  .msgs { display: flex; flex-direction: column; gap: 7px; max-height: 46vh; overflow: auto; }
  .msg { max-width: 86%; font-size: 13px; padding: 7px 10px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
  .msg .t { font-size: 10px; color: var(--dim); margin-top: 3px; }
  .msg.me { align-self: flex-end; background: #16323a; border-color: #1f4650; }
  .msg .who { font-size: 10px; color: var(--accent); margin-bottom: 2px; }
  .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 8px 0; }
  button, .btn {
    font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card-2); color: var(--fg); cursor: pointer; min-height: 44px;
  }
  button:active { transform: scale(.985); }
  button.primary { background: #0f3f3a; border-color: #1a6b60; color: #d4fff7; }
  button.danger { background: #3a1a1a; border-color: #6b2626; color: #ffd9d9; }
  button:disabled { opacity: .5; }
  /* 「仪表盘」入口用 <a>，外观和按钮保持一致 */
  a.btn {
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card-2); color: var(--fg); min-height: 44px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  textarea, input[type=text] {
    width: 100%; font: inherit; font-size: 14px; color: var(--fg);
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px; resize: vertical;
  }
  .muted { color: var(--dim); font-size: 12px; }
  .foot { text-align: center; color: var(--dim); font-size: 11px; margin: 14px 0 4px; }
  .foot a { color: var(--accent); text-decoration: none; }
  .toast {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: #1f2d34; border: 1px solid #31454f; color: var(--fg); padding: 9px 15px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .22s; max-width: 88vw; text-align: center; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .swipe-hint { font-size: 11px; color: var(--dim); text-align: center; padding-bottom: 6px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="health-dot"></span>
  <h1 id="title">QQ 后台</h1>
  <span class="sub" id="stamp">加载中…</span>
</header>

<section class="card">
  <h2>运行状态 <span class="tag" id="mode-tag"></span></h2>
  <div class="chips" id="chips"></div>
</section>

<section class="card">
  <h2>快捷操作</h2>
  <textarea id="test-msg" rows="2" placeholder="发给 ownerQQ 一条测试消息…"></textarea>
  <div class="actions">
    <button class="primary" id="btn-send">发送测试消息</button>
    <button id="btn-read">标记已读</button>
    <button id="btn-refresh">刷新</button>
    <a class="btn" id="open-dashboard" href="dashboard">仪表盘</a>
    <button class="danger" id="btn-restart">重启桥接</button>
  </div>
</section>

<section class="card">
  <h2>连接质量 <span class="tag" id="cq-hours">24h</span></h2>
  <div class="metrics">
    <div class="metric"><div class="v" id="cq-disc">–</div><div class="k">断线次数</div></div>
    <div class="metric"><div class="v" id="cq-long">–</div><div class="k">最长中断</div></div>
    <div class="metric"><div class="v" id="cq-avg">–</div><div class="k">平均重连</div></div>
  </div>
  <div style="margin-top:9px" id="cq-src"></div>
</section>

<section class="card">
  <h2>限流队列 <span class="tag" id="rl-tag"></span></h2>
  <div class="metrics">
    <div class="metric"><div class="v" id="rl-depth">–</div><div class="k">当前积压</div></div>
    <div class="metric"><div class="v" id="rl-sent">–</div><div class="k">已补发</div></div>
    <div class="metric"><div class="v" id="rl-drop">–</div><div class="k">已丢弃</div></div>
  </div>
  <div style="margin-top:9px" id="rl-list"></div>
</section>

<section class="card">
  <h2>未读 <span class="tag" id="unread-tag"></span></h2>
  <div id="unread-list"></div>
</section>

<section class="card">
  <h2>最近消息 <span class="tag" id="recent-tag"></span></h2>
  <div class="msgs" id="recent-list"><div class="empty">加载中…</div></div>
</section>

<section class="card">
  <h2>用量</h2>
  <div class="metrics">
    <div class="metric"><div class="v" id="tk-cost">–</div><div class="k">累计花费</div></div>
    <div class="metric"><div class="v" id="tk-turns">–</div><div class="k">回合</div></div>
    <div class="metric"><div class="v" id="tk-cache">–</div><div class="k">缓存命中</div></div>
  </div>
</section>

<div class="foot">
  <a href="./">桌面版完整控制台</a> · <span id="foot-ver">qq-bridge</span>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // 页面既可从 3100 直连（/m），也可经手机桥反代（/__qq/m）。取公共前缀拼接口路径。
  const BASE = location.pathname.replace(/\/m\/?$/, '');
  const API = (p) => BASE + p;

  // 令牌：直连时来自 ?token=（或上次存下的 localStorage）；经桥反代时由桥在服务端注入，这里留空即可。
  const qs = new URLSearchParams(location.search);
  let token = qs.get('token') || localStorage.getItem('consoleToken') || '';
  if (qs.get('token')) {
    localStorage.setItem('consoleToken', qs.get('token'));
    // 令牌留在地址栏会被截图/分享带出去，转存后抹掉
    history.replaceState(null, '', location.pathname);
  }

  const $ = (id) => document.getElementById(id);
  const state = { ownerQQ: 0, key: '', timer: 0 };

  // 顶栏「仪表盘」入口：带上令牌，省得手机上再贴一次（仪表盘读完会 replaceState 抹掉）。
  function syncDashboardLink() {
    const a = $('open-dashboard');
    if (!a) return;
    a.href = API('/dashboard') + (token ? '?token=' + encodeURIComponent(token) : '');
  }
  syncDashboardLink();
  document.addEventListener('DOMContentLoaded', syncDashboardLink);

  function toast(msg, ms) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), ms || 2400);
  }

  // 并发请求同时 401 时只取一次令牌（否则首屏会连打四五次 /api/local-token）。
  let tokenPromise = null;
  function ensureToken() {
    if (token) return Promise.resolve(token);
    if (!tokenPromise) {
      tokenPromise = fetch(API('/api/local-token'), { cache: 'no-store' })
        .then((r) => (r.ok ? r.json() : null))
        .then((got) => {
          if (got && got.token) {
            token = got.token;
            localStorage.setItem('consoleToken', token);
            syncDashboardLink();
          }
          return token;
        })
        .catch(() => token)
        .finally(() => { tokenPromise = null; });
    }
    return tokenPromise;
  }

  async function api(path, opts) {
    const o = Object.assign({ headers: {} }, opts || {});
    if (token) o.headers['x-console-token'] = token;
    if (o.body && !o.headers['content-type']) o.headers['content-type'] = 'application/json';
    o.cache = 'no-store';
    let res = await fetch(API(path), o);
    // 本机直连且地址里没带 ?token= 时，向只接受回环请求的 /api/local-token 取一次令牌再重试。
    // 经桥反代时桥已经注入令牌，这里不会走到这条分支。
    if (res.status === 401) {
      const got = await ensureToken();
      if (got) {
        o.headers['x-console-token'] = got;
        res = await fetch(API(path), o);
      }
    }
    let data = null;
    try { data = await res.json(); } catch (_) { /* 非 JSON */ }
    if (!res.ok || (data && data.ok === false)) {
      const err = (data && data.error) || ('HTTP ' + res.status);
      throw new Error(err);
    }
    return data;
  }

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtMs = (ms) => !ms ? '0s' : ms < 1000 ? Math.round(ms) + 'ms' : ms < 60000 ? (ms / 1000).toFixed(1).replace(/\.0$/, '') + 's' : Math.round(ms / 60000) + 'min';
  const fmtTime = (t) => {
    const d = new Date(t);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const today = new Date();
    return d.toDateString() === today.toDateString() ? hh + ':' + mm : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
  };
  const setChip = (label, text, cls) =>
    '<span class="chip ' + (cls || '') + '">' + esc(label) + ' <b>' + esc(text) + '</b></span>';

  function renderStatus(d) {
    const sl = d.snowluma || {};
    state.ownerQQ = Number(d.ownerQQ || 0);
    state.key = state.ownerQQ ? ('private:' + state.ownerQQ) : '';

    let dot = 'ok', title = d.role || 'QQ 后台';
    if (!sl.connected || sl.accountOnline === false) { dot = 'bad'; title += ' · 离线'; }
    else if (sl.degraded || sl.silent) { dot = 'warn'; title += ' · 降级'; }
    if (d.socialV2Paused) { dot = 'warn'; title += ' · 暂停'; }
    $('health-dot').className = 'dot ' + dot;
    $('title').textContent = title;
    $('mode-tag').textContent = d.mode || '';

    const chips = [
      setChip('DSH', d.dshReady ? '就绪' : '未就绪', d.dshReady ? 'ok' : 'bad'),
      setChip('SnowLuma', sl.connected ? (sl.accountOnline ? '在线' : '账号离线') : '未连接', sl.connected && sl.accountOnline ? 'ok' : 'bad'),
      setChip('心跳', sl.lastPacketAgoMs == null ? '—' : fmtMs(sl.lastPacketAgoMs) + '前', sl.good ? 'ok' : 'warn'),
      setChip('自动发消息', d.socialV2Paused ? '已暂停' : '运行中', d.socialV2Paused ? 'warn' : 'ok'),
      setChip('角色', d.role || '—')
    ];
    if (Array.isArray(d.allowPrivate) && d.allowPrivate.length) chips.push(setChip('白名单', d.allowPrivate.length + ' 人'));
    $('chips').innerHTML = chips.join('');
  }

  function renderConnQuality(d) {
    const s = (d && d.stats) || {};
    $('cq-disc').textContent = s.disconnects == null ? '–' : String(s.disconnects);
    $('cq-long').textContent = fmtMs(s.longestOutageMs);
    $('cq-avg').textContent = fmtMs(s.avgReconnectMs);
    const by = s.bySource || {};
    const rows = Object.keys(by).map((k) => {
      const v = by[k] || {};
      const name = k === 'snowluma' ? 'SnowLuma' : k === 'dsh' ? 'DSH' : k;
      return '<div class="row"><span class="k">' + esc(name) + (v.lastCode ? ' · code ' + esc(v.lastCode) : '') +
        '</span><span class="v">' + (v.disconnects || 0) + ' 次 / 最长 ' + fmtMs(v.longestOutageMs) + '</span></div>';
    });
    if (s.lastOutageAt) rows.push('<div class="row"><span class="k">最近断线</span><span class="v">' + fmtTime(s.lastOutageAt) + '</span></div>');
    if (s.ongoing) rows.push('<div class="row"><span class="k" style="color:var(--bad)">当前</span><span class="v">正在中断（已 ' + fmtMs(s.ongoing.downMs) + '）</span></div>');
    $('cq-src').innerHTML = rows.join('') || '<div class="empty">暂无数据</div>';
  }

  function renderRateLimit(d) {
    const s = (d && d.stats) || {};
    const items = (d && d.items) || [];
    const depth = Number(s.depth || 0);
    $('rl-depth').textContent = String(depth);
    $('rl-sent').textContent = String(s.totalSent ?? 0);
    $('rl-drop').textContent = String(s.totalDropped ?? 0);
    $('rl-tag').textContent = depth ? depth + ' 条待补发' : '队列空闲';
    if (!items.length) {
      $('rl-list').innerHTML = '<div class="empty">没有积压的消息</div>';
      return;
    }
    const now = Date.now();
    const rows = items.slice(0, 5).map((it) => {
      const wait = Math.max(0, Number(it.nextAttemptAt || 0) - now);
      const when = wait > 0 ? '等 ' + fmtMs(wait) : '即将重试';
      const label = it.label || it.kind || '消息';
      const tried = it.attempts ? '已试 ' + it.attempts + ' 次' : '首次';
      const err = it.lastError ? '<div class="t" style="color:var(--bad)">' + esc(it.lastError) + '</div>' : '';
      return '<div class="row"><span class="k">' + esc(label) + ' · ' + esc(it.key || '') + '</span>' +
        '<span class="v">' + when + ' / ' + tried + '</span></div>' + err;
    });
    const earliest = items.reduce((min, it) => Math.min(min, Number(it.firstAt || Infinity)), Infinity);
    if (Number.isFinite(earliest)) {
      rows.push('<div class="row"><span class="k">最早一条入队</span><span class="v">' + fmtTime(earliest) + '</span></div>');
    }
    $('rl-list').innerHTML = rows.join('');
  }

  function renderUnread(d) {
    const n = Number(d.unreadCount || 0);
    $('unread-tag').textContent = n ? n + ' 条待处理' : '全部已读';
    const msgs = (d.messages || []).slice(-10);
    $('unread-list').innerHTML = msgs.length
      ? msgs.map((m) => '<div class="msg"><div class="who">' + esc(m.sender || m.userId || '') + '</div>' + esc(m.text || m.plain || '') +
          '<div class="t">' + fmtTime(m.time) + '</div></div>').join('')
      : '<div class="empty">没有未读</div>';
  }

  function renderRecent(d) {
    const msgs = (d.messages || []);
    $('recent-tag').textContent = msgs.length + ' 条';
    if (!msgs.length) { $('recent-list').innerHTML = '<div class="empty">还没有消息</div>'; return; }
    $('recent-list').innerHTML = msgs.map((m) => {
      const mine = m.isSelf ? ' me' : '';
      const who = m.isSelf ? '' : '<div class="who">' + esc(m.sender || '') + '</div>';
      return '<div class="msg' + mine + '">' + who + esc(m.text || m.plain || '') + '<div class="t">' + fmtTime(m.time) + '</div></div>';
    }).join('');
    const box = $('recent-list');
    box.scrollTop = box.scrollHeight;
  }

  function renderTokens(d) {
    const t = (d && d.totals) || {};
    const sym = d && d.symbol || '¥';
    $('tk-cost').textContent = t.cost == null ? '–' : sym + Number(t.cost).toFixed(2);
    $('tk-turns').textContent = t.turns == null ? '–' : String(t.turns);
    $('tk-cache').textContent = t.cacheHitRate == null ? '–' : (Number(t.cacheHitRate) * 100).toFixed(1) + '%';
    if (d && d.priceVersion) $('foot-ver').textContent = 'qq-bridge · 价目 ' + d.priceVersion;
  }

  async function loadAll(silent) {
    if (!silent) $('stamp').textContent = '刷新中…';
    const tasks = [
      api('/api/status').then(renderStatus),
      api('/api/conn-quality?hours=24').then(renderConnQuality),
      api('/api/rate-limit?limit=5').then(renderRateLimit).catch(() => {}),
      api('/api/tokens/summary').then(renderTokens)
    ];
    // 未读/最近依赖 ownerQQ，等状态回来后再发（但别串行拖慢首屏）
    tasks.push(api('/api/status').then(async (d) => {
      const qq = Number(d.ownerQQ || 0);
      if (!qq) return;
      const k = encodeURIComponent('private:' + qq);
      await Promise.all([
        api('/api/socialV2/unread?key=' + k + '&limit=10').then(renderUnread).catch(() => {}),
        api('/api/socialV2/recent?key=' + k + '&limit=20').then(renderRecent).catch(() => {})
      ]);
    }).catch(() => {}));
    await Promise.allSettled(tasks);
    $('stamp').textContent = '更新 ' + fmtTime(Date.now());
  }

  function bindActions() {
    $('btn-refresh').addEventListener('click', () => { loadAll().then(() => toast('已刷新')); });

    $('btn-send').addEventListener('click', async () => {
      const text = $('test-msg').value.trim();
      if (!text) { toast('先写点什么'); return; }
      if (!state.ownerQQ) { toast('还没拿到 ownerQQ'); return; }
      const btn = $('btn-send');
      btn.disabled = true;
      try {
        await api('/api/test-send', { method: 'POST', body: JSON.stringify({ kind: 'private', id: state.ownerQQ, message: text }) });
        $('test-msg').value = '';
        toast('已发送到 QQ');
      } catch (e) { toast('发送失败：' + e.message, 3600); }
      finally { btn.disabled = false; }
    });

    $('btn-read').addEventListener('click', async () => {
      if (!state.key) { toast('还没拿到会话 key'); return; }
      try {
        const d = await api('/api/socialV2/mark-read', { method: 'POST', body: JSON.stringify({ key: state.key }) });
        toast('已标为已读（未读 ' + (d.unreadCount ?? 0) + '）');
        loadAll(true);
      } catch (e) { toast('标记失败：' + e.message, 3600); }
    });

    $('btn-restart').addEventListener('click', async () => {
      if (!confirm('重启桥接进程？会中断正在进行的模型回合（约 5 秒恢复）。')) return;
      try {
        await api('/api/restart', { method: 'POST', body: '{}' });
        toast('已请求重启，稍后自动重连…', 4000);
      } catch (e) { toast('重启失败：' + e.message, 4000); }
    });
  }

  function boot() {
    bindActions();
    loadAll().catch((e) => {
      $('stamp').textContent = '连接失败';
      $('health-dot').className = 'dot bad';
      $('chips').innerHTML = '<span class="chip bad">' + esc(e.message) + '</span>';
      if (/未授权|401/.test(e.message)) {
        $('chips').innerHTML += '<span class="chip">本机请用 http://127.0.0.1:3100/m；远程请经手机桥打开</span>';
      }
    });
    // 页面可见时 15s 刷新一次；后台不刷，省电
    state.timer = setInterval(() => { if (!document.hidden) loadAll(true).catch(() => {}); }, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(true).catch(() => {}); });

    // PWA：能装就装（iOS 用「添加到主屏幕」，不需要 SW）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(BASE + '/m/sw.js', { scope: BASE + '/m/' }).catch(() => {});
    }
  }

  boot();
})();
</script>
</body>
</html>
